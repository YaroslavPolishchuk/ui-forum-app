<!-- Header -->
<div class="header">
    <div class="logo-placeholder">
        <a routerLink="/">
            <img src="assets/logo-white.png" alt="Bicycle Forum" />
        </a>
    </div>
    <div class="field-validation">

        <div class="auth" *ngIf="!isLoggedIn(); else loggedInBlock">
            <form #form="ngForm" [class.submitted]="isSubmitted">
                Логин:
                <input type="text" name="loginValue" [(ngModel)]="loginValue" required="">
                Пароль:
                <input type="password" name="passwordValue" [(ngModel)]="passwordValue" required="">
                <button class="btn-login" (click)="onLoginClick(form)">Войти</button>
            </form>
            <button class="btn-register" (click)="onRegisterClick()" aria-label="Register">Регистрация</button>
        </div>
    </div>
    <div class="error-message" *ngIf="error">
        {{ error }}
    </div>

    <ng-template #loggedInBlock>
        <div class="auth">
            <div class="user-profile">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="greeting-container">
                    <span class="greeting-text">Привет,</span>
                    <span class="username-highlight">{{ username }}!</span>
                </div>
            </div>
            <button class="btn-login logout-btn" (click)="onLogoutClick()">
                <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Выйти
            </button>
        </div>
    </ng-template>
</div>

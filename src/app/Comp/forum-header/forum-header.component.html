<!-- Header -->
<div class="header">
    <div class="logo-placeholder">
        <a routerLink="/">
            <img src="assets/logo-white.png" alt="Bicycle Forum" />
        </a>
    </div>
    <div class="field-validation">

        <div class="auth" *ngIf="!(user$|async); else loggedInBlock">
            <form #form="ngForm" [class.submitted]="isSubmitted" (ngSubmit)="onLoginClick(form)">
                Логин:
                <input type="text" name="loginValue" [(ngModel)]="loginValue" required="">
                Пароль:
                <input type="password" name="passwordValue" [(ngModel)]="passwordValue" required="">
                <button type="submit" class="btn-login">Войти</button>
            </form>
            <button class="btn-register" (click)="onRegisterClick()" aria-label="Register">Регистрация</button>
        </div>
    </div>
    <div class="error-message" *ngIf="error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
    </div>

    <ng-template #loggedInBlock>
        <div class="auth">
            <div class="user-profile">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="greeting-container">
                    <span class="greeting-text">Привет,</span>
                    <span class="username-highlight">{{ username }}!</span>
                </div>
            </div>
            <button class="btn-login logout-btn" (click)="onLogoutClick()">
                <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Выйти
            </button>
        </div>
    </ng-template>
</div>
